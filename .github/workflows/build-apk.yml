name: Build Android APK

on:
  push:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          # If your files are in a subfolder, specify it here (e.g., path-to-folder: 'bryars-ai-0.1')
          # Leave this line out entirely if your build.gradle is already in the root directory.
          # path-to-folder: 'YOUR-SUBFOLDER-NAME'

      - name: Grant Execute Permission for Gradlew
        run: |
          # Update path if nested, e.g., chmod +x YOUR-SUBFOLDER-NAME/gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          # Update path if nested, e.g., ./gradlew -p YOUR-SUBFOLDER-NAME assembleDebug
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          # Update path if nested, e.g., YOUR-SUBFOLDER-NAME/app/build/outputs/apk/debug/*.apk
          path: app/build/outputs/apk/debug/*.apk
