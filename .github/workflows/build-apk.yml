name: Build Android APK

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unpack ZIP if present and Locate Project
        id: locate
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Unzipping $z..."
              unzip -q -o "$z"
            fi
          done
          
          SETTINGS_FILE=$(find . -maxdepth 3 -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle anywhere in the repository!"
            ls -la
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Android project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x "${{ steps.locate.outputs.project_dir }}/gradlew"

      - name: Build Debug APK with Wrapper
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: briar-ai-debug
          path: "${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk"
          
